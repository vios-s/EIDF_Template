# Descriptor read by the root ./build.sh entrypoint. See CONTRIBUTING.md for
# how to add a new buildable target.
TARGET=vllm
IMAGE_NAME=vllm-eidf
HAS_BASE=no
HAS_TEMPLATE=no
DESCRIPTION="vLLM OpenAI-compatible serving image"

# Job modes offered by the interactive wizard.
JOB_MODE_1_NAME=serving
JOB_MODE_1_LABEL="serving (auto-starts vllm serve)"
JOB_MODE_1_TEMPLATE=job.template.yaml
JOB_MODE_1_EXTRA_VAR=MODEL
JOB_MODE_1_EXTRA_PROMPT="Model to serve"
JOB_MODE_1_EXTRA_DEFAULT="Qwen/Qwen2.5-7B-Instruct"

JOB_MODE_2_NAME=interactive
JOB_MODE_2_LABEL="interactive (debug pod)"
JOB_MODE_2_TEMPLATE=job.interactive.yaml

# Serving mode also needs a Service for stable port-forwarding.
HAS_SERVICE=yes
SERVICE_TEMPLATE=service.template.yaml
SERVICE_JOB_MODE=serving
