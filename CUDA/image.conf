# Descriptor read by the root ./build.sh entrypoint. See CONTRIBUTING.md for
# how to add a new buildable target.
TARGET=cuda
IMAGE_NAME=cuda-eidf
HAS_BASE=yes
BASE_IMAGE_NAME=cuda-eidf-base
HAS_TEMPLATE=yes
DESCRIPTION="CUDA devel + conda training image"

# Job modes offered by the interactive wizard (numbered, at least one
# required). EXTRA_* fields are optional — set them when the mode needs one
# extra piece of information substituted into the job yaml as <NAME>.
JOB_MODE_1_NAME=interactive
JOB_MODE_1_LABEL="interactive (keep-alive pod, exec in and work by hand)"
JOB_MODE_1_TEMPLATE=job.interactive.yaml

JOB_MODE_2_NAME=batch
JOB_MODE_2_LABEL="batch (runs a command once and exits)"
JOB_MODE_2_TEMPLATE=job.template.yaml
JOB_MODE_2_EXTRA_VAR=COMMAND
JOB_MODE_2_EXTRA_PROMPT="Command to run"
JOB_MODE_2_EXTRA_DEFAULT="python train.py"

HAS_SERVICE=no
