# Descriptor read by the root ./build.sh entrypoint. See CONTRIBUTING.md for
# how to add a new buildable target.
TARGET=pytorch
IMAGE_NAME=pytorch-eidf
HAS_BASE=yes
BASE_IMAGE_NAME=pytorch-eidf-base
HAS_TEMPLATE=yes
DESCRIPTION="Conda-based PyTorch dev image"

# Job modes offered by the interactive wizard. This folder only has one —
# a keep-alive pod (job.template.yaml already IS the interactive style here).
JOB_MODE_1_NAME=interactive
JOB_MODE_1_LABEL="interactive (keep-alive pod, exec in and work by hand)"
JOB_MODE_1_TEMPLATE=job.template.yaml

HAS_SERVICE=no
